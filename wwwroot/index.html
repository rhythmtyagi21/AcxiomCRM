<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AcxiomCRM | Sales Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#dashboard"><span class="brand-mark">A</span><span>acxiom<span class="brand-light">CRM</span></span></a>
    <div class="workspace-label">WORKSPACE</div>
    <nav id="main-nav">
      <button class="nav-item active" data-page="dashboard"><span>▦</span> Dashboard</button>
      <button class="nav-item" data-page="customers"><span>♙</span> Customers <small id="customer-nav-count">8</small></button>
      <button class="nav-item" data-page="leads"><span>◎</span> Leads</button>
      <button class="nav-item" data-page="opportunities"><span>◈</span> Opportunities</button>
      <button class="nav-item" data-page="followups"><span>◷</span> Follow ups</button>
      <button class="nav-item" data-page="activities"><span>☷</span> Activities</button>
      <div class="workspace-label admin-label">MANAGEMENT</div>
      <button class="nav-item" data-page="reports"><span>▤</span> Reports</button>
      <button class="nav-item" data-page="users"><span>♧</span> Users & roles</button>
      <button class="nav-item" data-page="audit"><span>◴</span> Audit log</button>
    </nav>
    <div class="sidebar-bottom"><div class="help-card"><div class="help-icon">✦</div><strong>Need a hand?</strong><p>Your workspace guide is here to help.</p><button onclick="toast('Help guide will be connected in the full application.')">Open help centre ↗</button></div><div class="profile"><div class="avatar">RT</div><div><strong>Rhythm Tyagi</strong><p>Administrator</p></div><button class="profile-menu" aria-label="Profile menu">•••</button></div></div>
  </aside>
  <main class="main-area">
    <header class="topbar"><button class="mobile-menu" id="mobile-menu" aria-label="Open menu">☰</button><div class="breadcrumb">Workspace <span>/</span> <strong id="crumb">Dashboard</strong></div><div class="top-actions"><span class="today-label" id="today-label"></span><button class="icon-button" title="Notifications" onclick="toast('You are all caught up!')">♧<i></i></button><div class="avatar small-avatar">RT</div></div></header>
    <section class="page-content" id="page-content"></section>
    <footer>© 2026 AcxiomCRM <span>Built for better customer relationships.</span></footer>
  </main>
</div>
<div class="modal-backdrop" id="modal-backdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-header"><div><p class="eyebrow">WORKSPACE RECORD</p><h2 id="modal-title">Add record</h2></div><button class="close-modal" id="close-modal" aria-label="Close">×</button></div><form id="record-form"><div id="form-fields" class="form-grid"></div><div class="modal-footer"><button type="button" class="btn btn-light" id="cancel-modal">Cancel</button><button class="btn btn-primary" type="submit">Save record</button></div></form></section></div>
<div class="toast" id="toast" role="status"></div>
<script src="app.js"></script>
</body></html>
